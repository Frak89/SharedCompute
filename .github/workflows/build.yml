name: SharedCompute Android and Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  LLAMA_REF: d2bceda3de6d61429b885f4f012bc983c6dcfd50
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          export ANDROID_HOME="$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$MANAGER" --version
          set +o pipefail
          yes | "$MANAGER" --sdk_root="$SDK" --licenses
          set -o pipefail
          "$MANAGER" --sdk_root="$SDK" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          test -f "$SDK/platforms/android-36/android.jar"
          test -f "$SDK/ndk/28.2.13676358/build/cmake/android.toolchain.cmake"
      - name: Build RPC worker
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/build-android.sh
      - run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK contains ARM64 executable
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep lib/arm64-v8a/libsharedcompute_rpc.so
          cp app/build/outputs/apk/debug/app-debug.apk SharedCompute.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SharedCompute-Android
          path: SharedCompute.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch matching revision
        shell: pwsh
        run: |
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin $env:LLAMA_REF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C llama.cpp checkout --detach FETCH_HEAD
      - name: Build host
        shell: pwsh
        run: |
          cmake -S llama.cpp -B llama.cpp/build -A x64 -DGGML_RPC=ON -DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_BACKEND_DL=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_OPENSSL=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build llama.cpp/build --config Release --target llama-server ggml-rpc-server --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item bundle -ItemType Directory
          Get-ChildItem llama.cpp/build/bin -Recurse -File | Where-Object { $_.Extension -in '.exe','.dll' } | Copy-Item -Destination bundle
          Copy-Item host/Start-SharedCompute.ps1, llama.cpp/LICENSE -Destination bundle
          $env:LLAMA_REF | Set-Content bundle/llama-revision.txt
          if (!(Test-Path bundle/llama-server.exe)) { throw 'Missing host' }
          & bundle/llama-server.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SharedCompute-Windows
          path: bundle/
