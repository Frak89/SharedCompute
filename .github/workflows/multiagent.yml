name: SharedCompute CrossCompute Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'host/multiagent.py'
      - 'host/test_multiagent.py'
      - 'host/crosscompute.py'
      - 'host/test_crosscompute.py'
      - 'host/Start-Speculative.ps1'
      - '.github/workflows/multiagent.yml'
permissions:
  contents: read
jobs:
  multiagent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test team orchestration
        run: python -m unittest discover -s host -p 'test_*.py' -v
      - name: Compile desktop app
        run: |
          python -m pip install pyinstaller==6.13.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SharedCompute-CrossCompute host/multiagent.py
      - uses: actions/upload-artifact@v4
        with:
          name: SharedCompute-CrossCompute
          path: |
            dist/SharedCompute-CrossCompute.exe
            host/Start-Speculative.ps1
          if-no-files-found: error
