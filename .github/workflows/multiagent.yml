name: SharedCompute MultiAgent Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'host/multiagent.py'
      - 'host/test_multiagent.py'
      - '.github/workflows/multiagent.yml'
permissions:
  contents: read
jobs:
  multiagent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test team orchestration
        run: python -m unittest discover -s host -p test_multiagent.py -v
      - name: Compile desktop app
        run: |
          python -m pip install pyinstaller==6.13.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SharedCompute-MultiAgent host/multiagent.py
      - uses: actions/upload-artifact@v4
        with:
          name: SharedCompute-MultiAgent
          path: dist/SharedCompute-MultiAgent.exe
          if-no-files-found: error
