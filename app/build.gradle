plugins { id 'com.android.application' }
android {
 namespace 'com.ampy.sharedcompute'
 compileSdk 36
 defaultConfig { applicationId 'com.ampy.sharedcompute'; minSdk 30; targetSdk 36; versionCode 8; versionName '1.3.2'; ndk { abiFilters 'arm64-v8a' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/libsharedcompute_rpc.so'; keepDebugSymbols += '**/libsharedcompute_llama.so' } }
}